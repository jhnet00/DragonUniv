services:
  mariadb:
    image: mariadb:11.4
    container_name: dragon-univ-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: dragon_university
      MARIADB_USER: dragon_app
      MARIADB_PASSWORD: dragonpass
    ports:
      - "3306:3306"
    volumes:
      - dragon_univ_db:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dragon_univ_db:
