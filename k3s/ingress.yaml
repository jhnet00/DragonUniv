apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dragon-univ-ingress
  namespace: dragon-univ
spec:
  ingressClassName: traefik
  rules:
    - host: sugang.drg
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
